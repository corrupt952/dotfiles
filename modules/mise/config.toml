[tools]
bun = "1.4.4"
cmake = "4.4.4"
"conda:automake" = "1.19"
"conda:ca-certificates" = "2026.10.23"
"conda:curl" = "8.23.0"
"conda:grep" = "3.12"
"conda:libtool" = "2.5.4"
"conda:sed" = "4.10"
container = "1.6.1"
duckdb = "2.0.0"
"gem:cocoapods" = "1.17.0"
gh = "2.103.2"
"github:corrupt952/closest" = "2.0.1"
"github:corrupt952/sallyport" = "0.3.1"
"github:corrupt952/tmuxist" = "1.3.1"
"github:corrupt952/xckit" = "0.2.3"
"github:newren/git-filter-repo" = "2.47.0"
jactionlint = { version = "2.3.0", workflow = "release.yaml" }
node = "22.23.4"
ruby = "3.4.12"
shellcheck = "0.11.0"
swiftlint = "0.65.1"
uv = "0.13.5"
zizmor = "1.31.1"

[tools."http:op"]
version = "2.41.1"

[tools."http:op".platforms]
macos-arm64 = { url = "https://cache.agilebits.com/dist/1P/op2/pkg/v{{ version }}/op_darwin_arm64_v{{ version }}.zip", checksum = "sha256:2289771b68b521ee3dc1d63a013a6a1c5691e0c53e4c4fe79af8042b6ad3c7f5" }

[settings]
minimum_release_age = "3d"
lockfile = true
lockfile_platforms = ["macos-arm64"]
locked = true
paranoid = true
ruby.compile = false

[settings.self_update]
auto = true
