[tools]
bun = "1.4.4"
cmake = "4.4.4"
"conda:automake" = "1.19"
"conda:curl" = "8.23.0"
"conda:grep" = "3.12"
"conda:libtool" = "2.5.4"
"conda:sed" = "4.10"
duckdb = "2.0.0"
gh = "2.103.2"
"github:corrupt952/closest" = "2.0.1"
"github:corrupt952/sallyport" = "0.3.1"
"github:corrupt952/tmuxist" = "1.3.1"
"github:corrupt952/xckit" = "0.2.3"
jactionlint = { version = "2.3.0", workflow = "release.yaml" }
node = "22.23.4"
shellcheck = "0.11.0"
swiftlint = "0.65.1"
uv = "0.13.5"
zizmor = "1.31.1"

[settings]
minimum_release_age = "3d"
lockfile = true
lockfile_platforms = ["macos-arm64"]
locked = true
paranoid = true

[settings.self_update]
auto = true
