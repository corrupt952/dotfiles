name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          working_directory: .github/ci
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/.github/ci

      - name: shellcheck
        run: |
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*' | sort)
          shellcheck "${scripts[@]}"

      - name: jactionlint
        run: jactionlint --format github

      - name: zizmor
        run: zizmor .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          working_directory: .github/ci
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/.github/ci

      # The guard decides which Bash commands Claude Code may run, so a rule
      # that silently stops matching is a hole rather than a broken test.
      - name: claude bash guard
        run: python3 modules/claude/claude-bash-guard.test.py

      - name: mise lock
        run: python3 modules/mise/check-lock.test.py

  ci-result:
    name: CI Result
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs passed
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "Failed jobs:"
            echo "$failing"
            exit 1
          fi
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
